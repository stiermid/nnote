[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "nnote"
version = "0.3.5"
description = "A plain, file-based note-taking CLI"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Agil Mammadov", email = "mammadovagil@proton.me" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Text Editors",
]
keywords = ["notes", "cli", "note-taking", "productivity"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://stiermid.github.io/nnote"
Repository = "https://github.com/stiermid/nnote"

[project.scripts]
nnote = "nnote.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
docs = [
    "furo>=2024.0",
    "sphinx>=7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
