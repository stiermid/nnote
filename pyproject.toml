[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnote"
version = "0.1.3"
description = "cli note taker"
readme = "README.md"
license="GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[[project.authors]]
name = "Agil Mammadov"
email = "mammadovagil@tutamail.com"

[project.urls]
Documentation = "https://stiermid.github.io/nnote"
Repository = "https://github.com/stiermid/nnote"

[project.scripts]
nnote = "nnote.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
docs = ["sphinx>=7.0", "furo>=2024.0"]

[tool.setuptools.packages.find]
exclude = [".venv*", "tests*"]
