[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[project]
name = "nnote"
version = "0.1.3"
description = "cli note taker"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Agil Mammadov", email = "mammadovagil@tutamail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Documentation = "https://stiermid.github.io/nnote"
Repository = "https://github.com/stiermid/nnote"

[project.scripts]
nnote = "nnote.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
docs = [
    "furo>=2024.0",
    "sphinx>=7.0",
]

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
